# ============================================================
# Docker Compose - CPU Only (for machines without GPUs)
# ============================================================
# Usage:
#   docker compose -f docker-compose.cpu.yml up -d --build
#
# Requirements:
#   - Docker Engine 24+
#   - NVIDIA GPU is not required, Whisper runs in CPU mode
#
# NOTE: Whisper runs ~3-5x slower in CPU mode but
#       all functions continue to work flawlessly.
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-images-to-video
    restart: unless-stopped

    ports:
      - "80:80"

    # NO GPU - runs without deploy block

    # Force Whisper to CPU mode
    environment:
      - CUDA_VISIBLE_DEVICES=""
    
    env_file:
      - backend/.env

    volumes:
      - whisper-cache:/app/.cache

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  whisper-cache:
    driver: local
