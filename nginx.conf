# ============================================================
# Nginx Configuration
# ============================================================
# Serves Frontend (React) static files and proxies /api requests
# to the background Uvicorn server.
# ============================================================

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 300;

    # Video files can be large (allow up to 100MB)
    client_max_body_size 100M;

    # Gzip compression (For frontend)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream: Uvicorn backend
    upstream backend {
        server 127.0.0.1:8005;
    }

    server {
        listen 80;
        server_name _;

        # ── API Requests → Uvicorn ──
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Video generation can take a long time
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 30s;

            # Buffer for large responses
            proxy_buffering off;
        }

        # ── FastAPI Docs ──
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # ── Frontend Static Files ──
        location / {
            root /app/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets (JS/CSS/images)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
