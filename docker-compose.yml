# ============================================================
# Docker Compose - NVIDIA GPU Supported
# ============================================================
# Usage:
#   docker compose up -d --build
#
# Requirements:
#   - Docker Engine 24+
#   - NVIDIA Container Toolkit (nvidia-docker2)
#   - NVIDIA GPU driver must be installed
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: google-images-to-video
    restart: unless-stopped

    ports:
      - "80:80"     # Access via browser at http://localhost

    # ── NVIDIA GPU Access ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1           # 1 GPU is enough
              capabilities: [gpu]

    # ── Environment Variables ──
    # Method 1: Read from .env file
    env_file:
      - backend/.env

    # Method 2: Define directly (optional, if .env file is missing)
    # environment:
    #   - GEMINI_API_KEY=your_key_here
    #   - SERPER_API_KEY=your_key_here

    # ── Volume: Whisper model cache (prevents re-downloading on every build) ──
    volumes:
      - whisper-cache:/app/.cache

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  whisper-cache:
    driver: local
